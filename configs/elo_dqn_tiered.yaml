# ---------------------------------------------------------------------------
# EloBettingEnv — DQN agent, 15-feature obs, tiered bet sizing
# ---------------------------------------------------------------------------
# bet_tiers present → Discrete(7) action space:
#   0=Skip  1-3=Home@[0.5,1,2]  4-6=Away@[0.5,1,2]
# Shaping: quadratic risk penalty + EV bonus → optimal wager ∝ EV
# ---------------------------------------------------------------------------

env:
  name: elo_continuous

data:
  dir: data/features/enriched
  filename_pattern: "season_{season}_enriched.csv"
  train_seasons: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]
  test_seasons:  [2021, 2022, 2023]

env_params:
  initial_bankroll: 500.0
  bet_size: 1.0
  edge_threshold: 0.06        # |elo_market_residual| below this = no edge
  no_edge_penalty: 0.5        # linear edge penalty (scales with wager)
  bet_tiers: [0.5, 1.0, 2.0]  # discrete wager amounts → Discrete(7)
  risk_coeff: 0.1             # quadratic risk penalty: −0.1 × (wager/bet_size)²
  ev_bonus: 1.0               # EV bonus: +1.0 × ev × wager  (when ev > 0)

agent:
  algorithm: DQN
  total_timesteps: 200000
  seed: 42
  learning_starts: 1000
  buffer_size: 50000
  batch_size: 64
  gamma: 0.99
  tau: 0.01
  exploration_fraction: 0.3
  exploration_final_eps: 0.05
  verbose: 1

model:
  save_path: experiments/elo_dqn_tiered

wandb:
  project: nba-betting-rl
  name: elo-dqn-tiered
  entity: null
