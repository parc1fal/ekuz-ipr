# ---------------------------------------------------------------------------
# EloBettingEnv — DQN agent, 15-feature enriched obs (ELO + EV + fatigue)
# ---------------------------------------------------------------------------

env:
  name: elo

data:
  dir: data/features/enriched
  filename_pattern: "season_{season}_enriched.csv"
  train_seasons: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]
  test_seasons:  [2021, 2022, 2023]

env_params:
  initial_bankroll: 500.0
  bet_size: 1.0
  edge_threshold: 0.06     # |elo_market_residual| below this = no edge
  no_edge_penalty: 0.5     # shaped-reward penalty for betting without edge

agent:
  algorithm: DQN
  total_timesteps: 200000
  learning_starts: 1000
  buffer_size: 50000
  batch_size: 64
  gamma: 0.99
  tau: 0.01
  exploration_fraction: 0.3
  exploration_final_eps: 0.05
  seed: 42
  verbose: 1

model:
  save_path: experiments/elo_dqn_15feat_ev

wandb:
  project: nba-betting-rl
  name: elo-dqn-15feat-ev
  entity: null
