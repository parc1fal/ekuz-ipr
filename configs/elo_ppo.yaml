# ---------------------------------------------------------------------------
# EloBettingEnv — PPO agent, 4-feature trimmed obs
# ---------------------------------------------------------------------------

env:
  name: elo

data:
  dir: data/features
  filename_pattern: "season_{season}_elo.csv"
  train_seasons: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]
  test_seasons:  [2021, 2022, 2023]

env_params:
  initial_bankroll: 500.0
  bet_size: 1.0

agent:
  algorithm: PPO
  total_timesteps: 500000
  n_steps: 1200          # ~one full season per rollout
  n_epochs: 10
  batch_size: 64
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01         # entropy bonus — encourages exploring skip
  verbose: 1

model:
  save_path: experiments/elo_ppo_model

wandb:
  project: nba-betting-rl
  name: elo-ppo-4feat
  entity: null
