# ---------------------------------------------------------------------------
# EloBettingEnv — 9-feature environment with ELO ratings + market residual
# ---------------------------------------------------------------------------

env:
  name: elo

data:
  dir: data/features
  filename_pattern: "season_{season}_elo.csv"
  train_seasons: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]
  test_seasons:  [2021, 2022, 2023]

env_params:
  initial_bankroll: 500.0
  bet_size: 1.0

agent:
  algorithm: DQN
  total_timesteps: 100000
  learning_starts: 1000
  buffer_size: 15000
  batch_size: 32
  gamma: 0.99
  tau: 0.01
  exploration_fraction: 0.3
  exploration_final_eps: 0.05
  verbose: 1

model:
  save_path: experiments/elo_dqn_model

wandb:
  project: nba-betting-rl
  name: elo-dqn
  entity: null
